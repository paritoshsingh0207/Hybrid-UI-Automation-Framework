name: Hybrid UI Automation

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Automation engine
        type: choice
        options: [selenium, playwright]
        default: selenium
      browser:
        description: Browser
        type: choice
        options: [chrome, chromium, firefox, edge, webkit]
        default: chrome
      data_source:
        description: Test data source
        type: choice
        options: [feature, excel, both]
        default: both
      suite_file:
        description: TestNG suite
        type: choice
        options: [testng.xml, orangehrm-testng.xml]
        default: testng.xml
  push:
    branches: [main, hybrid-selenium-playwright-framework]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Secret values come from GitHub Actions Secrets. Nothing sensitive is
      # written into this workflow file or committed to the repository.
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check secured sample configuration
        if: ${{ github.event.inputs.suite_file == 'orangehrm-testng.xml' }}
        shell: bash
        run: |
          if [ -z "$ORANGEHRM_USERNAME" ] || [ -z "$ORANGEHRM_PASSWORD" ]; then
            echo "::error::Configure ORANGEHRM_USERNAME and ORANGEHRM_PASSWORD in GitHub Actions Secrets before running the secured OrangeHRM suite."
            exit 1
          fi

      - name: Install Playwright browsers
        if: ${{ github.event.inputs.engine == 'playwright' }}
        run: mvn -q -DskipTests compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run tests
        run: |
          mvn clean test \
            -DsuiteXmlFile=${{ github.event.inputs.suite_file || 'testng.xml' }} \
            -Dengine=${{ github.event.inputs.engine || 'selenium' }} \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Ddata.source=${{ github.event.inputs.data_source || 'both' }} \
            -Dheadless=true \
            -Dthread.count=4 \
            -Ddataprovider.thread.count=4

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-evidence
          path: |
            artifacts/
            target/reports/
            target/allure-results/
            target/site/allure-maven-plugin/
